# Ansible looks for ansible.cfg in the current folder first, so always run
# ansible commands from the repo root (session6-ansible/).
[defaults]
# Default inventory (Activity 1). Override any time with: -i inventory/aws_ec2.yml
inventory = inventory/hosts.ini

# How to log in to the EC2 servers
remote_user = ubuntu
private_key_file = ~/.ssh/session6-key.pem

# SHORTCUT FOR CLASS: don't prompt "are you sure you want to continue connecting?"
# for new servers. In production you'd keep host key checking on.
host_key_checking = False

# Pick the right Python on the servers without printing a warning
interpreter_python = auto_silent

# Where to find roles (Activity 3)
roles_path = roles

# Also look in the folder where Ubuntu's 'ansible' package keeps its collections,
# so ansible-lint (installed separately) finds community.general, amazon.aws, etc.
collections_path = ~/.ansible/collections:/usr/share/ansible/collections:/usr/lib/python3/dist-packages

retry_files_enabled = False

[ssh_connection]
# Faster: fewer SSH round trips per task
pipelining = True
