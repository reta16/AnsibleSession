---
# Broken playbook 2: should put a login message (motd) on the web servers
- name: Set the login message
  hosts: web
  become: true

  tasks:
    - name: Write /etc/motd
      ansible.builtin.copy:
        contents: "Welcome to {{ inventory_hostname }} - managed by Ansible\n"
        destination: /etc/motd
        mode: "0644"
