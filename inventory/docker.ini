# Docker fallback inventory: web1 and web2 are local containers
# (start them with: bash docker-fallback/up.sh).
#
#   ansible -i inventory/docker.ini web -m ping
#   ansible-playbook -i inventory/docker.ini webserver.yml
#
# Same group name 'web' as hosts.ini and aws_ec2.yml, so group_vars/web.yml
# and group_vars/all/ apply unchanged.

[web]
web1 ansible_host=172.30.0.11
web2 ansible_host=172.30.0.12

[web:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/session6-docker-key
