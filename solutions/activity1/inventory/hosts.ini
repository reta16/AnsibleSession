# Activity 1 solution: static inventory
# Copy to the repo:   cp -r solutions/activity1/. .
# then put YOUR IPs in inventory/hosts.ini.

[web]
web1 ansible_host=WEB1_PUBLIC_IP
web2 ansible_host=WEB2_PUBLIC_IP

# Groups of groups: 'servers' contains everything in 'web'
[servers:children]
web

# "You do" challenge: per-environment groups
[staging]
web1

[production]
web2
